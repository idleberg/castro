name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.value }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install, build, and upload your site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2

      - name: Hash the build output
        id: hash
        env:
          LC_ALL: C
        run: |
          value="$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Build hash: $value" >> "$GITHUB_STEP_SUMMARY"

      - name: Look up the previous deployment
        id: lookup
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deployed
          key: deployed-${{ steps.hash.outputs.value }}
          lookup-only: true

      - name: Compare against the previous deployment
        id: check
        run: |
          if [ "${{ steps.lookup.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Build output is unchanged, skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  record:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Record the deployed build hash
        run: echo "${{ needs.build.outputs.hash }}" > .deployed

      - name: Save the deployed build hash
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .deployed
          key: deployed-${{ needs.build.outputs.hash }}

  archive:
    needs: [build, deploy]
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve GitHub Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Submit to Wayback Machine
        uses: JamieMagee/wayback@e561c5018fb0e62988fddd732fb88345a3faa608 # v2.2.0
        with:
          url: ${{ steps.pages.outputs.base_url }}
          saveOutlinks: true
          saveScreenshot: true
