name: Bulk Submit to Internet Archive

on:
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: 'Sitemap URL to process (defaults to this repository’s GitHub Pages sitemap)'
        required: false

jobs:
  # Job 1: Parse sitemap and create chunked JSON array
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      matrix: ${{ steps.generate-chunks.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Resolves the site's base URL from the repository's Pages settings, so
      # that custom domains are honoured as well
      - name: Resolve GitHub Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate URL Chunks
        id: generate-chunks
        uses: './.github/actions/generate-chunks'
        with:
          sitemap-url: ${{ inputs.sitemap_url || format('{0}/sitemap-index.xml', steps.pages.outputs.base_url) }}

  # Job 2: Process chunks in parallel via matrix
  submit:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # Prevents one failing chunk from cancelling all other active jobs
      fail-fast: false
      # Adjust max-parallel based on GitHub runner limits and API limits
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Submit Chunk to Internet Archive
        uses: './.github/actions/submit-to-ia'
        with:
          url-chunk: ${{ toJson(matrix.chunk) }}

      # - name: Submit Chunk to Internet Archive
      #   env:
      #     IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      #     IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
