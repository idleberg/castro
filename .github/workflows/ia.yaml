name: Bulk Submit to Internet Archive

on:
  workflow_dispatch:
    inputs:
      force_new:
        description: 'Capture every URL afresh, ignoring recent snapshots'
        type: boolean
        required: false
        default: false

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Resolve pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Resolves the site's base URL from the repository's Pages settings, so
      # that custom domains are honoured as well
      - name: Resolve GitHub Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Only the forum listings are submitted, the Internet Archive picks up the
      # thread and member pages they link to on its own
      - name: Submit to Internet Archive
        uses: './.github/actions/submit-to-ia'
        with:
          sitemap-url: ${{ format('{0}/sitemap-index.xml', steps.pages.outputs.base_url) }}
          exclude: |
            /thread/
            /member/
          capture-outlinks: 'true'
          force-new: ${{ inputs.force_new }}
          ia-access-key: ${{ secrets.IA_ACCESS_KEY }}
          ia-secret-key: ${{ secrets.IA_SECRET_KEY }}
