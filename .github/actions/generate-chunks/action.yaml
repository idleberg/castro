name: 'Generate Chunks'
description: 'Generates chunks of URLs from a sitemap'

inputs:
  sitemap-url:
    description: 'Sitemap URL to process'
    required: true
  chunk-size:
    description: 'Number of URLs per chunk'
    required: false
    default: '50'

outputs:
  matrix:
    description: 'JSON array of URL chunks, suitable for a job matrix'

runs:
  using: 'node24'
  main: 'index.ts'
