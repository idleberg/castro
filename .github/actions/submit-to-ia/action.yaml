name: 'Submit to Internet Archive'
description: 'Submits the URLs of a sitemap to the Internet Archive'

inputs:
  sitemap-url:
    description: 'Sitemap URL to process'
    required: true
  include:
    description: 'Newline-separated regular expressions, a URL has to match one of them to be submitted'
    required: false
  exclude:
    description: 'Newline-separated regular expressions, matching URLs are skipped'
    required: false
  ia-access-key:
    description: 'Internet Archive S3 access key, see https://archive.org/account/s3.php'
    required: false
  ia-secret-key:
    description: 'Internet Archive S3 secret key, see https://archive.org/account/s3.php'
    required: false
  capture-outlinks:
    description: 'Have the Internet Archive follow and capture every link on the submitted pages'
    required: false
    default: 'false'
  force-new:
    description: 'Capture every URL afresh instead of reusing a recent snapshot, overriding if-not-archived-within'
    required: false
    default: 'false'
  if-not-archived-within:
    description: 'Skip the capture when a snapshot within this timespan exists, e.g. "30d". Leave empty, or set force-new, to capture every URL afresh'
    required: false
    default: '30d'
  request-delay:
    description: 'Delay between captures in milliseconds, authenticated accounts allow 6 per minute'
    required: false
    default: '10000'
  concurrency:
    description: 'Captures to keep in flight, the Internet Archive allows 7 sessions per account'
    required: false
    default: '6'
  fail-on-error:
    description: 'Fail the step when at least one URL could not be archived'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'index.ts'
